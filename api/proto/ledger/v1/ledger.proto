syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/xJohnNascimento/ledger/api/ledger/v1;ledgerv1";

// Money mutations carry a command reference. A replay with the same reference and body returns
// the stored outcome, including a stored refusal; the same reference with another body is
// REASON_REFERENCE_CONFLICT. Amounts are canonical base-10 integer strings in minor units.
service LedgerService {
  rpc EnsureAccount(EnsureAccountRequest) returns (EnsureAccountResponse);
  rpc PostJournal(PostJournalRequest) returns (PostJournalResponse);
  rpc ReserveFunds(ReserveFundsRequest) returns (ReserveFundsResponse);
  rpc CommitReservation(CommitReservationRequest) returns (CommitReservationResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateAccountControls(UpdateAccountControlsRequest) returns (UpdateAccountControlsResponse);
  rpc PostCorrection(PostCorrectionRequest) returns (PostCorrectionResponse);
  rpc ExportAuditSnapshot(ExportAuditSnapshotRequest) returns (stream ExportAuditSnapshotResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum OwnerKind {
  OWNER_KIND_UNSPECIFIED = 0;
  OWNER_KIND_CUSTOMER = 1;
  OWNER_KIND_PROVIDER = 2;
  OWNER_KIND_PAYMENT = 3;
  OWNER_KIND_HOUSE = 4;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_DEBIT = 1;
  SIDE_CREDIT = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_BLOCKED = 2;
}

enum ReservationState {
  RESERVATION_STATE_UNSPECIFIED = 0;
  RESERVATION_STATE_ACTIVE = 1;
  RESERVATION_STATE_COMMITTED = 2;
  RESERVATION_STATE_RELEASED = 3;
}

enum CommandOutcome {
  COMMAND_OUTCOME_UNSPECIFIED = 0;
  COMMAND_OUTCOME_COMPLETED = 1;
  COMMAND_OUTCOME_REFUSED = 2;
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_INVALID_AMOUNT = 1;
  REASON_INVALID_JOURNAL = 2;
  REASON_OUT_OF_SCOPE = 3;
  REASON_REFERENCE_CONFLICT = 4;
  REASON_ACCOUNT_CLASSIFICATION_CONFLICT = 5;
  REASON_INSUFFICIENT_FUNDS = 6;
  REASON_ACCOUNT_BLOCKED = 7;
  REASON_CEILING_EXCEEDED = 8;
  REASON_RESERVATION_FINAL = 9;
  REASON_NOT_FOUND = 10;
  REASON_NAMESPACE_NOT_ALLOWED = 11;
  REASON_PURPOSE_NOT_ALLOWED = 12;
  REASON_SCOPE_NOT_ALLOWED = 13;
  REASON_INVALID_RESERVATION = 14;
}

enum SnapshotStatus {
  SNAPSHOT_STATUS_UNSPECIFIED = 0;
  SNAPSHOT_STATUS_COMPLETE = 1;
  SNAPSHOT_STATUS_INCOMPLETE = 2;
}

// Attached to every error that carries a reason. Only the fields relevant to the reason are set.
message ErrorDetail {
  Reason reason = 1;
  string account_id = 2;
  string available = 3;
  string required = 4;
  ReservationState final_state = 5;
  string final_command_id = 6;
  string final_fingerprint = 7;
  string existing_command_id = 8;
  string ceiling = 9;
}

message Reference {
  string namespace = 1;
  string reference = 2;
}

message Account {
  string id = 1;
  string ledger_id = 2;
  OwnerKind owner_kind = 3;
  string owner_id = 4;
  string purpose = 5;
  string asset_code = 6;
  string account_key = 7;
  Side normal_side = 8;
  bool enforce_available = 9;
  AccountStatus status = 10;
  string overdraft_limit = 11;
}

message Balance {
  string account_id = 1;
  string asset_code = 2;
  string posted = 3;
  string reserved = 4;
  string available = 5;
  string overdraft_limit = 6;
  int64 version = 7;
  int64 last_posting_sequence = 8;
}

message JournalLine {
  string account_id = 1;
  Side side = 2;
  string asset_code = 3;
  string amount = 4;
}

message Journal {
  string kind = 1;
  string product_reference = 2;
  repeated JournalLine lines = 3;
}

message Posting {
  string entry_id = 1;
  int32 line_no = 2;
  string account_id = 3;
  string asset_code = 4;
  Side side = 5;
  string amount = 6;
  int64 account_sequence = 7;
}

message JournalEntry {
  string id = 1;
  string ledger_id = 2;
  string command_id = 3;
  string kind = 4;
  string product_reference = 5;
  google.protobuf.Timestamp recorded_at = 6;
  // ISO 8601 calendar date, YYYY-MM-DD.
  string accounting_date = 7;
  string corrects_entry_id = 8;
  string reason = 9;
  repeated Posting postings = 10;
}

message ReservationLeg {
  string account_id = 1;
  string max_reduction = 2;
}

message Reservation {
  string id = 1;
  string ledger_id = 2;
  Reference reservation_ref = 3;
  repeated ReservationLeg legs = 4;
  repeated string scope_account_ids = 5;
  ReservationState state = 6;
  string created_by_command_id = 7;
  string final_command_id = 8;
  string final_entry_id = 9;
  string final_fingerprint = 10;
}

message Command {
  string id = 1;
  string ledger_id = 2;
  Reference ref = 3;
  string operation = 4;
  string request_hash = 5;
  CommandOutcome outcome = 6;
  Reason reason = 7;
  string entry_id = 8;
  string reservation_id = 9;
  google.protobuf.Timestamp committed_at = 10;
  string account_id = 11;
}

message EnsureAccountRequest {
  string ledger_id = 1;
  OwnerKind owner_kind = 2;
  string owner_id = 3;
  string purpose = 4;
  string asset_code = 5;
  string account_key = 6;
}

message EnsureAccountResponse {
  Account account = 1;
  bool created = 2;
}

message PostJournalRequest {
  Reference command = 1;
  string ledger_id = 2;
  Journal journal = 3;
  string accounting_date = 4;
}

message PostJournalResponse {
  string command_id = 1;
  JournalEntry entry = 2;
}

message ReserveFundsRequest {
  Reference command = 1;
  string ledger_id = 2;
  Reference reservation_ref = 3;
  repeated ReservationLeg legs = 4;
  repeated string scope_account_ids = 5;
}

message ReserveFundsResponse {
  string command_id = 1;
  Reservation reservation = 2;
}

message CommitReservationRequest {
  Reference command = 1;
  string reservation_id = 2;
  Journal journal = 3;
}

message CommitReservationResponse {
  string command_id = 1;
  Reservation reservation = 2;
  JournalEntry entry = 3;
}

message ReleaseReservationRequest {
  Reference command = 1;
  string reservation_id = 2;
  Journal return_journal = 3;
}

message ReleaseReservationResponse {
  string command_id = 1;
  Reservation reservation = 2;
  JournalEntry entry = 3;
}

message ReservationLookup {
  string ledger_id = 1;
  Reference reservation_ref = 2;
}

message GetReservationRequest {
  oneof lookup {
    string reservation_id = 1;
    ReservationLookup by_reference = 2;
  }
}

message GetReservationResponse {
  Reservation reservation = 1;
}

message GetCommandRequest {
  string ledger_id = 1;
  Reference command = 2;
}

message GetCommandResponse {
  Command command = 1;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  Balance balance = 1;
}

message ListPostingsRequest {
  string account_id = 1;
  int64 after_sequence = 2;
  int32 limit = 3;
}

message ListPostingsResponse {
  repeated Posting postings = 1;
  int64 next_after_sequence = 2;
}

message UpdateAccountControlsRequest {
  Reference command = 1;
  string account_id = 2;
  optional AccountStatus status = 3;
  optional string overdraft_limit = 4;
}

message UpdateAccountControlsResponse {
  string command_id = 1;
  Account account = 2;
}

message PostCorrectionRequest {
  Reference command = 1;
  string ledger_id = 2;
  Journal journal = 3;
  string corrects_entry_id = 4;
  string reason = 5;
  string accounting_date = 6;
}

message PostCorrectionResponse {
  string command_id = 1;
  JournalEntry entry = 2;
}

message ExportAuditSnapshotRequest {
  string ledger_id = 1;
}

message SnapshotHeader {
  int32 schema_version = 1;
  string source_id = 2;
  string dataset_id = 3;
  google.protobuf.Timestamp captured_at = 4;
}

// counts holds the number of records of each kind: account, balance, entry, reservation and command.
// content_hash is the hex SHA-256 over the header and every record before the trailer, each written
// as its 4-byte big-endian length followed by its deterministic protobuf encoding.
message SnapshotTrailer {
  SnapshotStatus status = 1;
  map<string, int64> counts = 2;
  string content_hash = 3;
}

message ExportAuditSnapshotResponse {
  oneof record {
    SnapshotHeader header = 1;
    Account account = 2;
    Balance balance = 3;
    JournalEntry entry = 4;
    Reservation reservation = 5;
    Command command = 6;
    SnapshotTrailer trailer = 7;
  }
}
