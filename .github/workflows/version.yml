name: version

# Cuts a release once CI passes on a merge to main. Every pull request carries one release label,
# which release-label.yml enforces, and the merges since the last release add up to the largest of
# their labels. The tag gets GitHub's release notes and the image the release workflow publishes.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run at a time, so two merges never take the same version.
    concurrency:
      group: version
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(.github/scripts/next-version.sh "$SHA")
          if [ -z "$version" ]; then
            echo "No pull request merged since the last release asks for one."
            exit 0
          fi
          # Release tags are annotated, as Git intends for releases. A run that failed after creating a
          # tag finds it in place, so each tag is created only when missing. The Go API module is
          # released with the service, under its own tag.
          tag() {
            if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null); then
              target=${ref#* }
              if [ "${ref%% *}" = tag ]; then
                target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq .object.sha)
              fi
              if [ "$target" != "$SHA" ]; then
                echo "::error::The tag $1 already points at $target, not at $SHA. Move or delete it before this release can continue."
                exit 1
              fi
              return
            fi
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$1" -f message="$1" -f object="$SHA" -f type=commit \
              -f "tagger[name]=github-actions[bot]" -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" \
              -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$1" -f sha="$object" > /dev/null
          }
          tag "api/$version"
          tag "$version"
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A tag pushed with the workflow's own token starts no other workflow, so the image is built here.
  release:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
