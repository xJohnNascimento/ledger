version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xJohnNascimento/ledger
